<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VideoGame Radar</title>
  <meta name="description" content="Catálogo de videojuegos con datos de RAWG, hecho con Streamlit y ejecutado en el navegador con stlite.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.11.0/build/stlite.css">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    #carga { padding: 48px 24px; text-align: center; color: #444; }
  </style>
</head>
<body>
  <div id="root"><p id="carga">Cargando la app en tu navegador (la primera vez tarda unos 20-30 segundos)…</p></div>
  <script type="module">
    // La app de Streamlit se ejecuta entera en el navegador con stlite (Pyodide).
    // En producción el código y la base se leen de la rama main de GitHub.
    // Chroma no funciona en el navegador: el chat usa su búsqueda SQL alternativa.
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.11.0/build/stlite.js";
    const local = ["localhost", "127.0.0.1"].includes(location.hostname);
    const base = local ? "" : "https://raw.githubusercontent.com/alvarodc093-pixel/Video-Game-Rag-Assistant/main/";
    const codigo = ["app.py", "consultas.py", "paginas/__init__.py", "paginas/vision.py", "paginas/catalogo.py",
                    "paginas/generos.py", "paginas/plataformas.py", "paginas/buscar.py", "paginas/chat.py"];
    const files = Object.fromEntries(codigo.map((f) => [f, { url: base + f }]));
    files["datos.db"] = { url: base + "data/catalogo_demo.db" };
    files[".streamlit/config.toml"] = { url: base + ".streamlit/config.toml" };
    mount({ requirements: ["pandas", "sqlite3"], entrypoint: "app.py", files }, document.getElementById("root"));
  </script>
</body>
</html>
